name: Deploy do bUGAdão para o GitHub Pages

on:
  # O robô vai rodar sempre que você der um push na branch main
  push:
    branches: ['main']
  
  # Libera o botão na aba Actions para você forçar o deploy a qualquer momento
  workflow_dispatch:

# Permissões necessárias para o robô alterar o GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Instalar o Node.js
        # 24 = o mesmo major do dev local, e o mínimo que a suíte exige:
        #  • `node:sqlite` (DatabaseSync), usado pelos testes de ingestão em
        #    memória, não existe no Node 20;
        #  • `npm test` passa o glob para o `--test`, e quem resolve o padrão é
        #    o Node (a aspa impede o shell de expandir).
        # Os jobs de cron (riot-sync / relatorio-discord) seguem no 20: rodam
        # outro código e não dependem de nada disso.
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Instalar dependências
        run: npm install

      # Antes do build: um deploy só sai se a suíte passar. Sem isto, uma
      # regressão como o INSERT OR REPLACE que apagava as partidas da tribo
      # chegava ao ar mesmo com o teste de regressão no repo.
      - name: Rodar os testes
        run: npm test

      - name: Compilar o Vue (Build)
        run: npm run build

      - name: Configurar o Pages
        uses: actions/configure-pages@v4

      - name: Fazer upload dos arquivos compilados
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # O Vite salva tudo na pasta dist

      - name: Publicar no GitHub Pages!
        id: deployment
        uses: actions/deploy-pages@v4
name: Riot API Daily Sync Trator

# O relatório do Discord LÊ o que este job escreveu — ele não busca nada na Riot.
# Por isso a rodada de 07:00 BRT de segunda e sexta: são os dias de post (09:00
# BRT), e ela encosta o que entrou depois da coleta da madrugada. Duas horas de
# folga porque a segunda chega com o fim de semana inteiro de partidas novas.
on:
  schedule:
    - cron: '0 7 * * *'     # 07:00 UTC = 04:00 BRT (coleta da madrugada)
    - cron: '0 10 * * 1,5'  # 10:00 UTC = 07:00 BRT, seg e sex: fecha os dados do relatório das 09:00
    - cron: '30 20 * * *'   # 20:30 UTC = 17:30 BRT (mantém o site fresco no fim da tarde)
  workflow_dispatch:

jobs:
  sync-job:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Execute Trator Script
        run: node cron/sync.js
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}

      # ARTEFATOS:
      - name: Compactar e Fazer Upload dos Arquivos de Log
        if: always() # Garante que os relatórios subam mesmo se o script der algum erro no meio do caminho
        uses: actions/upload-artifact@v4
        with:
          name: Relatorios-Historico-Jogadores-D1
          path: logs/
          retention-days: 7 # Os relatórios ficam guardados no GitHub por 7 dias